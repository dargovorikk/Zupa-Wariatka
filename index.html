<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Zupa Wariatka – gra dla dzieci</title>
<meta name="description" content="Wesoła gra dla dzieci: złap warzywa i owoce do garnka i ugotuj zupę. Działa w przeglądarce, na Androidzie i iPhonie.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ff7f50">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zupa Wariatka">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#ffe8b0;position:fixed;inset:0;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas{display:block;touch-action:none}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top) + 10px) 12px 0;pointer-events:none;font-weight:800;font-size:22px;color:#5a2d0c}
.pill{background:rgba(255,255,255,.8);border-radius:22px;padding:5px 14px;box-shadow:0 3px 0 rgba(0,0,0,.08)}
#mute{pointer-events:auto;border:0;background:rgba(255,255,255,.8);border-radius:50%;width:44px;height:44px;font-size:20px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(255,232,176,.45)}
.card{background:#fff;border-radius:28px;padding:22px 20px 18px;max-width:380px;width:100%;text-align:center;color:#5a2d0c;
  box-shadow:0 8px 0 #e8553a,0 16px 34px rgba(0,0,0,.18);max-height:calc(100% - 20px);overflow:auto}
h1{margin:0 0 4px;font-size:38px;line-height:1.1;color:#e8553a}
h2{margin:0 0 6px;font-size:30px;color:#e8553a}
p{margin:8px 0;font-size:17px;line-height:1.4}
.sub{font-size:19px;font-weight:700}
.big-btn{border:0;background:#7cc36b;color:#fff;font-size:26px;font-weight:800;padding:14px 44px;border-radius:40px;
  box-shadow:0 6px 0 #4e9a40;cursor:pointer;margin-top:12px;font-family:inherit}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #4e9a40}
.langs{margin-top:14px;display:flex;justify-content:center;gap:8px}
.langs button{border:2px solid #ffd6a5;background:#fff8e7;border-radius:14px;padding:5px 12px;font-weight:800;font-size:15px;color:#5a2d0c;cursor:pointer;font-family:inherit}
.langs button.on{background:#ffb703;border-color:#ffb703;color:#fff}
.bounce{font-size:34px;margin:6px 0 2px}
.bounce span{display:inline-block;animation:b 1.1s infinite ease-in-out}
.bounce span:nth-child(2){animation-delay:.15s}.bounce span:nth-child(3){animation-delay:.3s}
.bounce span:nth-child(4){animation-delay:.45s}.bounce span:nth-child(5){animation-delay:.6s}
@keyframes b{50%{transform:translateY(-10px) rotate(10deg)}}
.score-big{font-size:46px;font-weight:900;color:#7cc36b;margin:2px 0}
.soupname{font-size:22px;font-weight:800;color:#e8553a}
.ingr{font-size:24px;line-height:1.5;margin:6px 0;word-spacing:6px}
.best{font-size:16px;opacity:.8}
.newbest{color:#ffb703;font-weight:900;font-size:20px}
.site{display:inline-block;margin-top:12px;font-size:13px;color:#a86b3c;text-decoration:none}
.hidden{display:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <span class="pill" id="score">0</span>
  <span class="pill" id="hearts"></span>
  <button id="mute" aria-label="Dźwięk">🔊</button>
</div>

<div id="menu" class="overlay">
  <div class="card">
    <div class="bounce"><span>🥕</span><span>🍅</span><span>🥦</span><span>🍓</span><span>🌽</span></div>
    <h1 id="t-title"></h1>
    <p class="sub" id="t-sub"></p>
    <p id="t-how"></p>
    <p class="best" id="t-bestmenu"></p>
    <button class="big-btn" id="play"></button>
    <div class="langs">
      <button data-l="pl">PL</button><button data-l="uk">UA</button><button data-l="en">EN</button>
    </div>
  </div>
</div>

<div id="over" class="overlay hidden">
  <div class="card">
    <h2 id="t-over"></h2>
    <div class="score-big" id="final"></div>
    <div class="newbest hidden" id="t-newbest"></div>
    <div class="best" id="t-best"></div>
    <p class="soupname" id="soupname"></p>
    <div class="ingr" id="ingr"></div>
    <button class="big-btn" id="again"></button><br>
    <a class="site" id="site" href="https://weganpolska.pl/" target="_blank" rel="noopener"></a>
  </div>
</div>

<script>
(function(){
"use strict";

/* ---------- Teksty ---------- */
const T={
  pl:{title:'Zupa Wariatka',sub:'Złap warzywa i owoce do garnka!',
    how:'Przesuwaj garnek palcem. Łap warzywa i owoce 🥕🍅. Uważaj na skarpety i buty – fuj! ⭐ = +5, 🌶️ = +3, 💚 = życie.',
    play:'Graj!',again:'Jeszcze raz!',best:'Rekord',over:'Zupa gotowa!',newBest:'Nowy rekord!',points:'pkt',
    good:['Mniam!','Pycha!','Chrup!','Smaczne!','Hop!','Ale dobre!'],star:'Gwiazdka! +5',chili:'Ostre! +3',heart:'Życie!',
    bad:{'🧦':'Fuj, skarpeta!','👟':'Bleee, but!','🧱':'Cegła?!','🧸':'Miś nie do zupy!','🔩':'Śrubka? Nie!','🥾':'Bucior?!','📎':'Spinacz?!'},
    tiers:['Zupa Malutka','Zupa Smaczna','Zupa Turbo-Mniam','Zupa Kosmiczna'],
    site:'Prawdziwe przepisy dla rodziców: weganpolska.pl',siteUrl:'https://weganpolska.pl/',sound:'Dźwięk'},
  uk:{title:'Шалений Супчик',sub:'Лови овочі й фрукти в каструлю!',
    how:'Рухай каструлю пальцем. Лови овочі й фрукти 🥕🍅. Обережно зі шкарпетками й черевиками – фу! ⭐ = +5, 🌶️ = +3, 💚 = життя.',
    play:'Грати!',again:'Ще раз!',best:'Рекорд',over:'Супчик готовий!',newBest:'Новий рекорд!',points:'очок',
    good:['Ням!','Смакота!','Хрум!','Смачно!','Гоп!','Оце так!'],star:'Зірочка! +5',chili:'Гостро! +3',heart:'Життя!',
    bad:{'🧦':'Фу, шкарпетка!','👟':'Бее, кросівок!','🧱':'Цеглина?!','🧸':'Ведмедик не для супу!','🔩':'Гвинтик? Ні!','🥾':'Черевик?!','📎':'Скріпка?!'},
    tiers:['Супчик-Малючок','Смачний Супчик','Турбо-Ням Супчик','Космічний Супчик'],
    site:'Справжні рецепти для батьків: weganpolska.pl',siteUrl:'https://weganpolska.pl/',sound:'Звук'},
  en:{title:'Crazy Soup',sub:'Catch veggies and fruit in the pot!',
    how:'Move the pot with your finger. Catch veggies and fruit 🥕🍅. Watch out for socks and shoes – yuck! ⭐ = +5, 🌶️ = +3, 💚 = extra life.',
    play:'Play!',again:'Again!',best:'Best',over:'Soup is ready!',newBest:'New record!',points:'pts',
    good:['Yum!','Tasty!','Crunch!','Nom nom!','Hop!','So good!'],star:'Star! +5',chili:'Spicy! +3',heart:'Extra life!',
    bad:{'🧦':'Eww, a sock!','👟':'Blech, a shoe!','🧱':'A brick?!','🧸':'Teddy is not soup!','🔩':'A bolt? No!','🥾':'A boot?!','📎':'A paperclip?!'},
    tiers:['Tiny Soup','Tasty Soup','Turbo-Yum Soup','Cosmic Soup'],
    site:'Real recipes for parents: weganpolska.pl',siteUrl:'https://weganpolska.pl/en/',sound:'Sound'}
};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let lang=store.get('zw-lang');
if(!T[lang]){const n=(navigator.language||'pl').toLowerCase();lang=n.startsWith('uk')?'uk':n.startsWith('pl')?'pl':(n.startsWith('en')?'en':'pl');}
let best=parseInt(store.get('zw-best')||'0',10)||0;

const $=id=>document.getElementById(id);
function applyLang(){
  const L=T[lang];document.documentElement.lang=lang==='uk'?'uk':lang;
  $('t-title').textContent=L.title;$('t-sub').textContent=L.sub;$('t-how').textContent=L.how;
  $('play').textContent=L.play;$('again').textContent=L.again;$('t-over').textContent=L.over;
  $('t-newbest').textContent=L.newBest;$('site').textContent=L.site;$('site').href=L.siteUrl;
  $('t-bestmenu').textContent=best?(L.best+': '+best):'';$('mute').setAttribute('aria-label',L.sound);
  document.querySelectorAll('.langs button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
}
document.querySelectorAll('.langs button').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.l;store.set('zw-lang',lang);applyLang();}));

/* ---------- Dźwięk ---------- */
let actx=null,muted=store.get('zw-mute')==='1';
function initAudio(){try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}}
function tone(f,d,type,vol,slide,delay){
  if(muted||!actx)return;
  try{const t0=actx.currentTime+(delay||0);const o=actx.createOscillator(),g=actx.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,t0+d);
    g.gain.setValueAtTime(vol||.15,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);
    o.connect(g);g.connect(actx.destination);o.start(t0);o.stop(t0+d+.02);}catch(e){}
}
const sfx={
  good(){tone(520,.12,'triangle',.16,1.8)},
  bad(){tone(170,.35,'sawtooth',.1,.5)},
  star(){tone(660,.12,'triangle',.14,0,0);tone(880,.12,'triangle',.14,0,.09);tone(1180,.18,'triangle',.14,0,.18)},
  chili(){tone(300,.3,'square',.07,2.6)},
  heart(){tone(440,.12,'sine',.15,0,0);tone(660,.2,'sine',.15,0,.1)},
  over(){tone(500,.25,'triangle',.14,.7,0);tone(350,.45,'triangle',.14,.6,.22)}
};
function setMuteIcon(){$('mute').textContent=muted?'🔇':'🔊';}
$('mute').addEventListener('click',e=>{e.stopPropagation();muted=!muted;store.set('zw-mute',muted?'1':'0');setMuteIcon();});
setMuteIcon();

/* ---------- Plansza ---------- */
const cv=$('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,bgDots=[];
const pot={x:0,y:0,w:120,h:75,chomp:0,dizzy:0,shake:0,hot:0};
let target=0;
let emoCache={};
function resize(){
  const nd=Math.min(window.devicePixelRatio||1,2);if(nd!==DPR){DPR=nd;emoCache={};}
  W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  pot.w=Math.max(96,Math.min(W*0.27,160));pot.h=pot.w*0.64;
  pot.y=H-pot.h-Math.max(28,H*0.06);
  if(!pot.x)pot.x=W/2;pot.x=clamp(pot.x,pot.w/2,W-pot.w/2);target=clamp(target||pot.x,pot.w/2,W-pot.w/2);
  bgDots=[];for(let i=0;i<Math.round(W*H/9000);i++)bgDots.push({x:Math.random()*W,y:Math.random()*H,r:4+Math.random()*10});
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function pick(a){return a[Math.floor(Math.random()*a.length)];}

function emo(e,s){
  const k=e+'|'+s;if(emoCache[k])return emoCache[k];
  const c=document.createElement('canvas');const box=Math.ceil(s*1.4);c.width=c.height=Math.ceil(box*DPR);
  const x=c.getContext('2d');x.scale(DPR,DPR);x.textAlign='center';x.textBaseline='middle';
  x.font=s+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif';
  x.fillText(e,box/2,box/2+s*0.06);emoCache[k]=c;return c;
}
function drawEmo(e,x,y,s,rot){
  const c=emo(e,Math.round(s));const d=c.width/DPR;
  ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);ctx.drawImage(c,-d/2,-d/2,d,d);ctx.restore();
}

/* ---------- Stan gry ---------- */
const GOOD=['🥕','🥦','🍅','🍎','🍌','🍓','🥑','🌽','🍆','🥔','🍐','🍇','🍉','🥒','🥬','🍋','🍒','🍊'];
const BAD=['🧦','👟','🧱','🧸','🔩','🥾','📎'];
let state='menu',items=[],parts=[],pops=[],score=0,lives=3,spawnT=0,dieT=0,t=0,collected={},recent=[],shownScore=-1,shownLives=-1;

function level(){return Math.floor(score/15);}
function speed(){return Math.min(H*0.8,H*0.3+level()*H*0.035);}
function interval(){return Math.max(0.36,1.0-level()*0.06);}
function badRate(){return 0.18+Math.min(0.17,level()*0.02);}

function spawn(deco){
  const s=Math.max(38,Math.min(W*0.11,62));let e,type;
  if(deco){e=pick(GOOD);type='good';}
  else{const r=Math.random();
    if(r<0.04){e='⭐';type='star';}
    else if(r<0.08){e='🌶️';type='chili';}
    else if(r<0.10&&lives<3){e='💚';type='heart';}
    else if(r<0.10+badRate()){e=pick(BAD);type='bad';}
    else{e=pick(GOOD);type='good';}}
  items.push({e,type,s,x:s/2+Math.random()*(W-s),y:-s,vy:(deco?H*0.14:speed())*(0.8+Math.random()*0.4),
    rot:0,vr:(Math.random()-0.5)*3,wob:Math.random()*6,dead:false});
}

function popup(text,x,y,color){pops.push({text,x,y,life:1,color:color||'#e8553a'});}
function burst(x,y,colors,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=80+Math.random()*220;
  parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-120,life:0.6+Math.random()*0.4,r:3+Math.random()*4,c:pick(colors)});}}

function collect(it){
  const L=T[lang];const px=it.x,py=pot.y;
  if(it.type==='good'){score+=1;collected[it.e]=(collected[it.e]||0)+1;recent.push(it.e);if(recent.length>4)recent.shift();
    pot.chomp=0.25;popup(pick(L.good),px,py-10,'#4e9a40');burst(px,py,['#7cc36b','#ffd166','#ff7f50'],10);sfx.good();}
  else if(it.type==='star'){score+=5;pot.chomp=0.3;popup(L.star,px,py-10,'#ffb703');burst(px,py,['#ffd166','#ffb703','#fff3c4'],22);sfx.star();}
  else if(it.type==='chili'){score+=3;collected[it.e]=(collected[it.e]||0)+1;pot.hot=2;pot.chomp=0.3;popup(L.chili,px,py-10,'#d62828');burst(px,py,['#d62828','#ff7f50'],14);sfx.chili();}
  else if(it.type==='heart'){lives=Math.min(3,lives+1);popup(L.heart,px,py-10,'#2a9d8f');burst(px,py,['#7cc36b','#b7e4a7'],14);sfx.heart();}
  else{lives-=1;pot.dizzy=0.8;pot.shake=0.4;popup(L.bad[it.e]||'Fuj!',px,py-10,'#7b2cbf');burst(px,py,['#9d8189','#6d6875'],12);sfx.bad();
    if(navigator.vibrate)try{navigator.vibrate(80)}catch(e){}
    if(lives<=0){state='dying';dieT=0.9;}}
}

function startGame(){
  initAudio();items=[];parts=[];pops=[];score=0;lives=3;spawnT=0.6;collected={};recent=[];
  pot.chomp=pot.dizzy=pot.shake=pot.hot=0;state='play';
  $('menu').classList.add('hidden');$('over').classList.add('hidden');$('hud').classList.remove('hidden');
}
function showOver(){
  state='over';sfx.over();const L=T[lang];
  const isBest=score>best;if(isBest){best=score;store.set('zw-best',String(best));}
  $('final').textContent=score+' '+L.points;
  $('t-newbest').classList.toggle('hidden',!(isBest&&score>0));
  $('t-best').textContent=L.best+': '+best;
  const tier=score<10?0:score<30?1:score<60?2:3;$('soupname').textContent=L.tiers[tier];
  const list=Object.entries(collected).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([e,n])=>e+'×'+n).join(' ');
  $('ingr').textContent=list||'💧';
  $('hud').classList.add('hidden');$('over').classList.remove('hidden');$('t-bestmenu').textContent=L.best+': '+best;
}
$('play').addEventListener('click',startGame);
$('again').addEventListener('click',startGame);

/* ---------- Sterowanie ---------- */
const keys={l:false,r:false};
function setTarget(cx){target=clamp(cx,pot.w/2,W-pot.w/2);}
cv.addEventListener('pointerdown',e=>{setTarget(e.clientX);});
cv.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons||e.pressure>0)setTarget(e.clientX);});
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')keys.l=true;
  if(e.key==='ArrowRight'||e.key==='d')keys.r=true;
  if((e.key==='Enter'||e.key===' ')&&state!=='play'&&state!=='dying'){e.preventDefault();startGame();}
});
window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.l=false;if(e.key==='ArrowRight'||e.key==='d')keys.r=false;});
document.addEventListener('touchmove',e=>{if(e.target===cv)e.preventDefault();},{passive:false});

/* ---------- Aktualizacja ---------- */
function update(dt){
  if(state==='play'){spawnT-=dt;if(spawnT<=0){spawn(false);spawnT=interval();}}
  else if(state==='menu'||state==='over'){spawnT-=dt;if(spawnT<=0){spawn(true);spawnT=0.7;}}
  if(keys.l)target-=W*1.3*dt;if(keys.r)target+=W*1.3*dt;target=clamp(target,pot.w/2,W-pot.w/2);
  pot.x+=(target-pot.x)*Math.min(1,dt*14);
  pot.chomp=Math.max(0,pot.chomp-dt);pot.dizzy=Math.max(0,pot.dizzy-dt);pot.shake=Math.max(0,pot.shake-dt);pot.hot=Math.max(0,pot.hot-dt);
  for(const it of items){
    it.y+=it.vy*dt;it.rot+=it.vr*dt;it.x+=Math.sin(t*2.2+it.wob)*18*dt;
    if(state==='play'&&Math.abs(it.x-pot.x)<pot.w*0.5&&it.y+it.s*0.3>pot.y&&it.y<pot.y+pot.h*0.45){it.dead=true;collect(it);}
    if(it.y>H+it.s)it.dead=true;
  }
  items=items.filter(i=>!i.dead);
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=600*dt;p.life-=dt;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=60*dt;p.life-=dt*0.9;}
  pops=pops.filter(p=>p.life>0);
  if(state==='dying'){dieT-=dt;if(dieT<=0)showOver();}
  if(score!==shownScore){$('score').textContent='🍲 '+score;shownScore=score;}
  if(lives!==shownLives){$('hearts').textContent='❤️'.repeat(Math.max(0,lives))+'🤍'.repeat(Math.max(0,3-lives));shownLives=lives;}
}

/* ---------- Rysowanie ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawBg(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#fff6d5');g.addColorStop(1,'#ffd6a5');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.45)';for(const d of bgDots){ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,Math.PI*2);ctx.fill();}
  const cy=pot.y+pot.h-6;
  ctx.fillStyle='#c98b55';ctx.fillRect(0,cy,W,H-cy);
  ctx.fillStyle='#a86b3c';ctx.fillRect(0,cy,W,8);
  ctx.fillStyle='rgba(0,0,0,.06)';for(let x=-20;x<W;x+=70)ctx.fillRect(x,cy+18,40,4);
}

function nearestItem(){let best=null,bd=1e9;for(const it of items){if(it.y>pot.y)continue;const d=Math.hypot(it.x-pot.x,it.y-pot.y);if(d<bd){bd=d;best=it;}}return best;}

function drawPot(){
  const {w,h}=pot;const ox=pot.shake>0?Math.sin(t*70)*7*(pot.shake/0.4):0;
  const hot=pot.hot>0;
  ctx.save();ctx.translate(pot.x+ox,pot.y);
  // cień
  ctx.fillStyle='rgba(0,0,0,.12)';ctx.beginPath();ctx.ellipse(0,h+2,w*0.42,h*0.08,0,0,Math.PI*2);ctx.fill();
  // uchwyty
  ctx.fillStyle=hot?'#9b1c1c':'#b8412c';
  rr(-w*0.62,h*0.2,w*0.18,h*0.17,h*0.08);ctx.fill();rr(w*0.44,h*0.2,w*0.18,h*0.17,h*0.08);ctx.fill();
  // zupa w środku
  ctx.fillStyle=hot?'#ff9f1c':'#8fd16f';ctx.beginPath();ctx.ellipse(0,h*0.12,w*0.48,h*0.11,0,0,Math.PI*2);ctx.fill();
  // wystające składniki
  const rs=w*0.24;recent.forEach((e,i)=>{const n=recent.length;const px=(i-(n-1)/2)*w*0.2;drawEmo(e,px,h*0.02-Math.sin(t*3+i)*2,rs,(i%2?.25:-.25));});
  // korpus
  const g=ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,hot?'#ff4d4d':'#ff8a5c');g.addColorStop(1,hot?'#b30000':'#e8553a');
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-w/2,h*0.14);ctx.lineTo(w/2,h*0.14);
  ctx.quadraticCurveTo(w/2,h,w*0.3,h);ctx.lineTo(-w*0.3,h);ctx.quadraticCurveTo(-w/2,h,-w/2,h*0.14);ctx.fill();
  // brzeg
  ctx.fillStyle=hot?'#c1121f':'#d64531';rr(-w*0.54,h*0.08,w*1.08,h*0.13,h*0.06);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.35)';rr(-w*0.38,h*0.3,w*0.1,h*0.4,w*0.05);ctx.fill();
  // policzki
  ctx.fillStyle='rgba(255,182,193,.85)';ctx.beginPath();ctx.ellipse(-w*0.3,h*0.66,w*0.07,h*0.05,0,0,Math.PI*2);ctx.ellipse(w*0.3,h*0.66,w*0.07,h*0.05,0,0,Math.PI*2);ctx.fill();
  // oczy
  const ey=h*0.46,ex=w*0.17,er=w*0.085;
  if(pot.dizzy>0){
    ctx.strokeStyle='#3d1a05';ctx.lineWidth=Math.max(2.5,w*0.025);ctx.lineCap='round';
    for(const sx of [-ex,ex]){ctx.save();ctx.translate(sx,ey);ctx.rotate(t*8);ctx.beginPath();ctx.moveTo(-er*0.7,-er*0.7);ctx.lineTo(er*0.7,er*0.7);ctx.moveTo(er*0.7,-er*0.7);ctx.lineTo(-er*0.7,er*0.7);ctx.stroke();ctx.restore();}
  }else{
    const n=nearestItem();let dx=0,dy=-0.3;
    if(n){const vx=n.x-pot.x,vy=n.y-(pot.y+ey);const l=Math.hypot(vx,vy)||1;dx=vx/l;dy=vy/l;}
    const blink=(Math.sin(t*1.3)>0.985)?0.15:1;
    for(const sx of [-ex,ex]){
      ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(sx,ey,er,er*blink,0,0,Math.PI*2);ctx.fill();
      if(blink===1){ctx.fillStyle='#3d1a05';ctx.beginPath();ctx.arc(sx+dx*er*0.42,ey+dy*er*0.42,er*0.5,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(sx+dx*er*0.42-er*0.15,ey+dy*er*0.42-er*0.18,er*0.16,0,Math.PI*2);ctx.fill();}
    }
  }
  // usta
  const my=h*0.72;ctx.lineCap='round';
  if(pot.dizzy>0){ctx.strokeStyle='#3d1a05';ctx.lineWidth=Math.max(2.5,w*0.022);ctx.beginPath();
    for(let i=0;i<=8;i++){const x=-w*0.12+i*w*0.03,y=my+Math.sin(i*1.6+t*10)*h*0.03;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.stroke();}
  else if(pot.chomp>0){ctx.fillStyle='#5a1a0a';ctx.beginPath();ctx.ellipse(0,my,w*0.1,h*0.1*(0.6+pot.chomp*1.6),0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ff7b9c';ctx.beginPath();ctx.ellipse(0,my+h*0.05,w*0.06,h*0.035,0,0,Math.PI*2);ctx.fill();}
  else{ctx.strokeStyle='#3d1a05';ctx.lineWidth=Math.max(2.5,w*0.022);ctx.beginPath();ctx.arc(0,my-h*0.06,w*0.1,0.2*Math.PI,0.8*Math.PI);ctx.stroke();}
  ctx.restore();
  // para z ostrej zupy
  if(hot){ctx.fillStyle='rgba(255,255,255,.75)';for(let i=0;i<3;i++){const p=(t*1.5+i/3)%1;ctx.beginPath();ctx.arc(pot.x+(i-1)*w*0.25+Math.sin(t*4+i)*6,pot.y-p*h*1.2,6+p*10,0,Math.PI*2);ctx.globalAlpha=1-p;ctx.fill();}ctx.globalAlpha=1;}
}

function draw(){
  drawBg();
  for(const it of items){
    if(it.type==='star'){ctx.fillStyle='rgba(255,209,102,.5)';ctx.beginPath();ctx.arc(it.x,it.y,it.s*0.62+Math.sin(t*8)*3,0,Math.PI*2);ctx.fill();}
    drawEmo(it.e,it.x,it.y,it.s,it.rot);
  }
  drawPot();
  for(const p of parts){ctx.globalAlpha=Math.max(0,Math.min(1,p.life*1.5));ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=1;
  const fs=Math.max(20,Math.min(W*0.065,30));
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='900 '+fs+'px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
  for(const p of pops){ctx.globalAlpha=Math.min(1,p.life*1.6);const sc=1+(1-p.life)*0.3;ctx.save();ctx.translate(clamp(p.x,90,W-90),p.y);ctx.scale(sc,sc);
    ctx.lineWidth=6;ctx.lineJoin='round';ctx.strokeStyle='#fff';ctx.strokeText(p.text,0,0);ctx.fillStyle=p.color;ctx.fillText(p.text,0,0);ctx.restore();}
  ctx.globalAlpha=1;
}

let last=performance.now();
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;t+=dt;update(dt);draw();requestAnimationFrame(loop);}

window.addEventListener('resize',resize);
resize();applyLang();requestAnimationFrame(loop);

if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
}
})();
</script>
